model_params:

  # GLONET deterministic daily forecast on EDITO S3.
  # Store name: YYYYMMDD.zarr (e.g. 20240103.zarr).
  GLONET_FCST:
    input_format: "zarr"
    velocity_mode: "deterministic"
    bucket_name: "oceanbench-bucket"
    endpoint_url: "https://s3.waw3-1.cloudferro.com"
    path: "s3://oceanbench-bucket/public/ml-forecast-outputs/glonet/"
    fname_prefix: "public/ml-forecast-outputs/glonet/"
    lon: "longitude"
    lat: "latitude"
    time: "time"
    var_u: "uo"
    var_v: "vo"
    grid_type: "regular"
    u_depth: "depth"
    v_depth: "depth"

  GLOW_FCST:
    input_format: "zarr"
    velocity_mode: "deterministic"
    bucket_name: "oceanbench-bucket"
    endpoint_url: "https://s3.waw3-1.cloudferro.com"
    path: "s3://oceanbench-bucket/dev/ml-forecast-outputs/glowcascade_v5_ring/"
    fname_prefix: "dev/ml-forecast-outputs/glowcascade_v5_ring/"
    lon: "lon"
    lat: "lat"
    time: "time"
    var_u: "uo"
    var_v: "vo"
    grid_type: "regular"
    u_depth: "depth"
    v_depth: "depth"
    meshmask: "static/mask_GLOW.nc"


  # CLASS1 GLOENS ensemble forecast velocity stores on CloudFerro S3.
  # U/V store filenames are discovered automatically for each run date.
  GLOENS_FCST:
    input_format: "zarr"
    velocity_mode: "mean"  # mean | member | deterministic
    ensemble_dim: "ens"
    ensemble_member: null  # set for velocity_mode: member
    bucket_name: "MOISICEEF"
    endpoint_url: "https://s3.waw3-1.cloudferro.com"
    path: "s3://MOISICEEF/"
    fname_prefix: "glo4-ens50_ng_1d-m_"
    lon: "nav_lon"
    lat: "nav_lat"
    time: "time"
    var_u: "uo"
    var_v: "vo"
    grid_type: "irregular"
    meshmask: "/scratch/cregnier/static/iORCA025_meshmask_v3.1.nc"


  GLO12_FCST:

    path: "/utmp/smer/regnierc/SORT-2/DAILY/GLO12Q/glo12qv4/"
    fname_prefix: "GLO12_ng_1d-m_"
    lon: "nav_lon"
    lat: "nav_lat"
    time: "time_counter"
    var_u: "uo"
    var_v: "vo"
    grid_type: "irregular"
