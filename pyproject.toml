[build-system]
requires = ["hatchling", "hatch-regex-commit"]
build-backend = "hatchling.build"

[project]
name = "validation-tools_drift"
dynamic = ["version"]
description = "Library for lagrangian dispersion"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "BSD-3-Clause"
authors = [
  { name = "REGNIER Charly", email = "cregnier@mercator-ocean.fr" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
  "matplotlib>=3.6",
  "dask",
  "xarray>=2022.6.0",
  "netCDF4",
  "zarr",
  "joblib",
  "numpy",
  "parcels",
  "pexpect"
]

[project.urls]
Repository = "https://gitlab.mercator-ocean.fr/mercator/qualif/validation_tools_drifters"

[project.scripts]
validation_plot = "validation.plot:main"

[tool.hatch.version]
source = "regex_commit"
path = "validation_tools_drifters/version.py"
check_dirty = false
commit = true
commit_message = "[ci skip] Version bump committed by Jenkins"
tag = true
tag_message = "Tagged for deployment by Jenkins"
tag_sign = false

[tool.hatch.build.targets.sdist]
include = ["/validation_tools_drifters"]

[tool.hatch.build.targets.wheel]
include = ["/validation_tools_drifters"]

[tool.hatch.envs.lint]
name = "lib-pyt-lint"
skip-install = true
prefix=".venv"
dependencies = [
  "flake8 == 7.0",
  "pyproject-flake8 == 7.0",
]

[tool.hatch.envs.lint.scripts]
check = "pflake8 --exit-zero --format=pylint --output-file reports/flake8.txt validation_tools_drifters"

[tool.flake8]
exclude = ".venv, .hatch, test, .git, __init__.py"
exclude-ignore = "F403, F401, F405, E305, E302, E203, E722, W503"
max-line-length = 120

[tool.hatch.envs.default]
type="conda"
command="conda"
prefix=".venv"
environment-file = "conda-env-dev.yml"
python = "3.12"


[tool.hatch.envs.test]
name = "lib-pyt-test"
dependencies = [
  "pytest",
  "coverage[toml]",
  "pytest-cov",
  "pytest-watcher",
  "pytest-sugar",
  "pre-commit"
]

[tool.hatch.envs.test.scripts]
run-cov = "pytest -v -s --log-cli-level=INFO --cov-config=pyproject.toml --cov=validation_tools_drifters --cov-append --cov-report=xml:reports/cobertura.xml --junit-xml=reports/junit.xml --cov=tests"
run = "run-coverage -v -s"

[tool.coverage.run]
source_pkgs = ["validation_tools_drifters", "test", "functional_test"]
branch = true
parallel = true
omit = [
  "test/*",
  "functional_test/*",
  "/examples/*",
  "/NOTEBOOKS/*",
]

[tool.coverage.paths]
py4cylc = ["validation_tools_drifters"]
tests = ["test", "functional_test"]

[tool.coverage.report]
exclude_lines = [
  "if __name__ == .__main__.:",
  "__version__",
  "if TYPE_CHECKING:",
]
omit = [
  "/test/*",
  "/functional_test/*",
  "/examples/*",
  "/NOTEBOOKS/*",
]
